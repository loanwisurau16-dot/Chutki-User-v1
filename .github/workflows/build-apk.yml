name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build React App and Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      # Production-grade stable Capacitor v6
      - name: Install Capacitor v6 Stable
        run: |
          npm install @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 --legacy-peer-deps

      - name: Build Vite React Web App
        run: |
          npm run build

      # Fresh clean project setup
      - name: Fresh Setup of Capacitor Android Project
        run: |
          rm -rf android capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.chutki.user",
            "appName": "Chutki",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8"
        run: |
          cd android
          ./gradlew assembleDebug -x lint -x test --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chutki-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
