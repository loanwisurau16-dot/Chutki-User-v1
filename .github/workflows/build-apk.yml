name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build React App and Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Maven Central 429 Too Many Requests bypass via Google Mirror
      - name: Configure Gradle Maven Mirror
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  }
              }
              repositories {
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
              }
          }
          EOF

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install Capacitor Plugins
        run: |
          npm install @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 \
            @codetrix-studio/capacitor-google-auth@^3.3.6 \
            @capacitor/geolocation@^6.0.0 \
            @capacitor/local-notifications@^6.0.0 \
            @capacitor-community/speech-recognition@^6.0.0 --legacy-peer-deps

      - name: Build Vite React Web App
        run: |
          npm run build

      - name: Fresh Setup with com.gossaigaon.bazar
        run: |
          rm -rf android capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.gossaigaon.bazar",
            "appName": "Chutki",
            "webDir": "dist",
            "plugins": {
              "GoogleAuth": {
                "scopes": ["profile", "email"],
                "serverClientId": "396740286096-qpdnc5g4ja1jv7p7i04dns4or9dvpc3n.apps.googleusercontent.com",
                "forceCodeForRefreshToken": true
              },
              "LocalNotifications": {
                "smallIcon": "ic_stat_chutki",
                "iconColor": "#0c831f",
                "sound": "beep.wav"
              }
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      # =========================================================================
      # 1. APP HOME-SCREEN ICON GENERATION (Safe-Zone Centered)
      # =========================================================================
      - name: Set Chutki App Logo Icons (Safe-Zone Adjusted)
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick

          SRC_ICON="public/assets/aistudio/IMG-20261115-WA0008_6f19703a.jpg"
          if [ ! -f "$SRC_ICON" ]; then
            SRC_ICON="public/pwa-512x512.png"
          fi
          echo "Generating centered Safe-Zone App Icon from: $SRC_ICON"

          RES_DIR="android/app/src/main/res"

          # mdpi
          convert "$SRC_ICON" -resize 72x72 -background '#0c831f' -gravity center -extent 108x108 "$RES_DIR/mipmap-mdpi/ic_launcher_foreground.png"
          convert "$SRC_ICON" -resize 44x44 -background '#0c831f' -gravity center -extent 48x48   "$RES_DIR/mipmap-mdpi/ic_launcher.png"
          convert "$SRC_ICON" -resize 44x44 -background '#0c831f' -gravity center -extent 48x48   "$RES_DIR/mipmap-mdpi/ic_launcher_round.png"

          # hdpi
          convert "$SRC_ICON" -resize 108x108 -background '#0c831f' -gravity center -extent 162x162 "$RES_DIR/mipmap-hdpi/ic_launcher_foreground.png"
          convert "$SRC_ICON" -resize 66x66   -background '#0c831f' -gravity center -extent 72x72   "$RES_DIR/mipmap-hdpi/ic_launcher.png"
          convert "$SRC_ICON" -resize 66x66   -background '#0c831f' -gravity center -extent 72x72   "$RES_DIR/mipmap-hdpi/ic_launcher_round.png"

          # xhdpi
          convert "$SRC_ICON" -resize 144x144 -background '#0c831f' -gravity center -extent 216x216 "$RES_DIR/mipmap-xhdpi/ic_launcher_foreground.png"
          convert "$SRC_ICON" -resize 88x88   -background '#0c831f' -gravity center -extent 96x96   "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
          convert "$SRC_ICON" -resize 88x88   -background '#0c831f' -gravity center -extent 96x96   "$RES_DIR/mipmap-xhdpi/ic_launcher_round.png"

          # xxhdpi
          convert "$SRC_ICON" -resize 216x216 -background '#0c831f' -gravity center -extent 324x324 "$RES_DIR/mipmap-xxhdpi/ic_launcher_foreground.png"
          convert "$SRC_ICON" -resize 132x132 -background '#0c831f' -gravity center -extent 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
          convert "$SRC_ICON" -resize 132x132 -background '#0c831f' -gravity center -extent 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png"

          # xxxhdpi
          convert "$SRC_ICON" -resize 288x288 -background '#0c831f' -gravity center -extent 432x432 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_foreground.png"
          convert "$SRC_ICON" -resize 176x176 -background '#0c831f' -gravity center -extent 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"
          convert "$SRC_ICON" -resize 176x176 -background '#0c831f' -gravity center -extent 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png"

          # Background green
          sed -i 's/<color name="colorPrimary">.*<\/color>/<color name="colorPrimary">#0c831f<\/color>/' "$RES_DIR/values/colors.xml" || true

      # =========================================================================
      # 2. CHUTKI NOTIFICATION MONOCHROME STATUS BAR ICON (Replaces '(i)' fallback)
      # =========================================================================
      - name: Generate Chutki Notification Icon
        run: |
          RES_DIR="android/app/src/main/res"
          mkdir -p "$RES_DIR/drawable" "$RES_DIR/drawable-mdpi" "$RES_DIR/drawable-hdpi" "$RES_DIR/drawable-xhdpi" "$RES_DIR/drawable-xxhdpi" "$RES_DIR/drawable-xxxhdpi"

          # Android Vector Drawable (Pure White Transparent Cart + Lightning Silhouette)
          cat << 'EOF' > "$RES_DIR/drawable/ic_stat_chutki.xml"
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M7,18c-1.1,0 -1.99,0.9 -1.99,2S5.9,22 7,22s2,-0.9 2,-2 -0.9,-2 -2,-2zM1,2v2h2l3.6,7.59 -1.35,2.45c-0.16,0.28 -0.25,0.61 -0.25,0.96 0,1.1 0.9,2 2,2h12v-2H7.42c-0.14,0 -0.25,-0.11 -0.25,-0.25l0.03,-0.12 0.9,-1.63h7.45c0.75,0 1.41,-0.41 1.75,-1.03l3.58,-6.49A1,1 0,0 0,20 6H5.21l-0.94,-2H1zm16,16c-1.1,0 -1.99,0.9 -1.99,2s0.89,2 1.99,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/>
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M15,2l-4.5,6h3l-1.5,5 5,-6.5h-3z"/>
          </vector>
          EOF

          # SVG for high-res PNG generation
          cat << 'EOF' > /tmp/cart_icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96">
            <path fill="#ffffff" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            <path fill="#ffffff" d="M15 2l-4.5 6h3l-1.5 5 5-6.5h-3z"/>
          </svg>
          EOF

          convert -background transparent /tmp/cart_icon.svg -resize 24x24   "$RES_DIR/drawable-mdpi/ic_stat_chutki.png"
          convert -background transparent /tmp/cart_icon.svg -resize 36x36   "$RES_DIR/drawable-hdpi/ic_stat_chutki.png"
          convert -background transparent /tmp/cart_icon.svg -resize 48x48   "$RES_DIR/drawable-xhdpi/ic_stat_chutki.png"
          convert -background transparent /tmp/cart_icon.svg -resize 72x72   "$RES_DIR/drawable-xxhdpi/ic_stat_chutki.png"
          convert -background transparent /tmp/cart_icon.svg -resize 96x96   "$RES_DIR/drawable-xxxhdpi/ic_stat_chutki.png"

          echo "✅ Chutki Notification Icon generated successfully!"

      - name: Add Android Native Permissions (GPS, Notification, Microphone)
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml

      - name: Configure Android strings.xml for Google Sign-In
        run: |
          if ! grep -q "server_client_id" android/app/src/main/res/values/strings.xml; then
            sed -i 's|</resources>|    <string name="server_client_id">396740286096-qpdnc5g4ja1jv7p7i04dns4or9dvpc3n.apps.googleusercontent.com</string>\n</resources>|' android/app/src/main/res/values/strings.xml
          fi

      - name: Copy Firebase google-services.json
        run: |
          if [ -f "public/assets/aistudio/google-services_5c61c5de.json" ]; then
            cp public/assets/aistudio/google-services_5c61c5de.json android/app/google-services.json
            echo "google-services.json copied."
          fi

      - name: Grant Execute Permission to Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8"
        run: |
          cd android
          ./gradlew assembleDebug -x lint -x test --no-daemon

      - name: Print Debug SHA-1 Fingerprint
        run: |
          cd android
          ./gradlew signingReport | grep -A 5 "Variant: debug" || true

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gossaigaon-bazar-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
