name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # GitHub website se manually 'Run workflow' click karne ke liye

jobs:
  build:
    name: Generate Chutki APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Web Assets (Vite)
        run: npm run build

      - name: ⚡ Setup Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 📋 Copy Firebase google-services.json
        run: |
          if [ -f "public/assets/aistudio/google-services_5c61c5de.json" ]; then
            mkdir -p android/app
            cp public/assets/aistudio/google-services_5c61c5de.json android/app/google-services.json
            echo "✅ Firebase configuration copied!"
          fi

      - name: 📍 Configure Android Permissions (GPS, Internet, Notifications)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Insert required permissions if not already present
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
            echo "✅ Android permissions injected!"
          fi

      - name: 🔧 Make Gradle Executable
        run: chmod +x android/gradlew

      - name: 🔨 Compile Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Chutki-Grocery-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
