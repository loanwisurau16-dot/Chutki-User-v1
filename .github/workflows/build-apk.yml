name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Generate Gossaigaon Bazar APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Web Assets (Vite)
        run: npm run build

      - name: ⚡ Setup Android Platform (com.gossaigaon.bazar)
        run: |
          # Purana android folder clean karke fresh package name add karein
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: 📋 Copy Firebase Google Services Config
        run: |
          if [ -f "public/assets/aistudio/google-services_5c61c5de.json" ]; then
            mkdir -p android/app
            cp public/assets/aistudio/google-services_5c61c5de.json android/app/google-services.json
            echo "✅ Firebase google-services.json linked with com.gossaigaon.bazar"
          fi

      - name: 📍 Configure Safe Android Permissions
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(file)) {
              let xml = fs.readFileSync(file, "utf8");
              const perms = [
                "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />",
                "<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />",
                "<uses-permission android:name=\"android.permission.VIBRATE\" />",
                "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
              ].join("\n    ");
              if (!xml.includes("ACCESS_FINE_LOCATION")) {
                xml = xml.replace("<application", perms + "\n    <application");
                fs.writeFileSync(file, xml, "utf8");
                console.log("✅ Permissions added safely.");
              }
            }
          '

      - name: 🔧 Make Gradle Executable
        run: chmod +x android/gradlew

      - name: 🔨 Compile Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Gossaigaon-Bazar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
