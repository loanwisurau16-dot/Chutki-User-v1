name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build React App and Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Maven Central 429 Too Many Requests bypass via Google Mirror
      - name: Configure Gradle Maven Mirror
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  }
              }
              repositories {
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
              }
          }
          EOF

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install Capacitor Plugins
        run: |
          npm install @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 \
            @codetrix-studio/capacitor-google-auth@^3.3.6 \
            @capacitor/geolocation@^6.0.0 \
            @capacitor/local-notifications@^6.0.0 \
            @capacitor-community/speech-recognition@^6.0.0 --legacy-peer-deps

      - name: Build Vite React Web App
        run: |
          npm run build

      - name: Fresh Setup with com.gossaigaon.bazar
        run: |
          rm -rf android capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.gossaigaon.bazar",
            "appName": "Chutki",
            "webDir": "dist",
            "plugins": {
              "GoogleAuth": {
                "scopes": ["profile", "email"],
                "serverClientId": "396740286096-qpdnc5g4ja1jv7p7i04dns4or9dvpc3n.apps.googleusercontent.com",
                "forceCodeForRefreshToken": true
              },
              "LocalNotifications": {
                "smallIcon": "ic_launcher_round",
                "iconColor": "#0c831f",
                "sound": "beep.wav"
              }
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      # =========================================================================
      # CHUTKI LOGO KO ANDROID APP ICON (MIPMAPS) ME AUTOMATICALLY CONVERT KAREIN
      # =========================================================================
      - name: Set Chutki App Logo Icons
        run: |
          SRC_ICON="public/assets/aistudio/IMG-20261115-WA0008_6f19703a.jpg"
          if [ ! -f "$SRC_ICON" ]; then
            SRC_ICON="public/pwa-512x512.png"
          fi
          echo "Setting Chutki App Icon from: $SRC_ICON"

          RES_DIR="android/app/src/main/res"

          # mdpi (48x48, foreground 108x108)
          convert "$SRC_ICON" -resize 48x48   "$RES_DIR/mipmap-mdpi/ic_launcher.png"
          convert "$SRC_ICON" -resize 48x48   "$RES_DIR/mipmap-mdpi/ic_launcher_round.png"
          convert "$SRC_ICON" -resize 108x108 "$RES_DIR/mipmap-mdpi/ic_launcher_foreground.png"

          # hdpi (72x72, foreground 162x162)
          convert "$SRC_ICON" -resize 72x72   "$RES_DIR/mipmap-hdpi/ic_launcher.png"
          convert "$SRC_ICON" -resize 72x72   "$RES_DIR/mipmap-hdpi/ic_launcher_round.png"
          convert "$SRC_ICON" -resize 162x162 "$RES_DIR/mipmap-hdpi/ic_launcher_foreground.png"

          # xhdpi (96x96, foreground 216x216)
          convert "$SRC_ICON" -resize 96x96   "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
          convert "$SRC_ICON" -resize 96x96   "$RES_DIR/mipmap-xhdpi/ic_launcher_round.png"
          convert "$SRC_ICON" -resize 216x216 "$RES_DIR/mipmap-xhdpi/ic_launcher_foreground.png"

          # xxhdpi (144x144, foreground 324x324)
          convert "$SRC_ICON" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
          convert "$SRC_ICON" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png"
          convert "$SRC_ICON" -resize 324x324 "$RES_DIR/mipmap-xxhdpi/ic_launcher_foreground.png"

          # xxxhdpi (192x192, foreground 432x432)
          convert "$SRC_ICON" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"
          convert "$SRC_ICON" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png"
          convert "$SRC_ICON" -resize 432x432 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_foreground.png"

          # Set adaptive icon background color to brand green
          sed -i 's/<color name="colorPrimary">.*<\/color>/<color name="colorPrimary">#0c831f<\/color>/' "$RES_DIR/values/colors.xml" || true

          echo "✅ Chutki App Icon successfully applied to Android APK!"

      - name: Add Android Native Permissions (GPS, Notification, Microphone)
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml

      - name: Configure Android strings.xml for Google Sign-In
        run: |
          if ! grep -q "server_client_id" android/app/src/main/res/values/strings.xml; then
            sed -i 's|</resources>|    <string name="server_client_id">396740286096-qpdnc5g4ja1jv7p7i04dns4or9dvpc3n.apps.googleusercontent.com</string>\n</resources>|' android/app/src/main/res/values/strings.xml
          fi

      - name: Copy Firebase google-services.json
        run: |
          if [ -f "public/assets/aistudio/google-services_5c61c5de.json" ]; then
            cp public/assets/aistudio/google-services_5c61c5de.json android/app/google-services.json
            echo "google-services.json copied."
          fi

      - name: Grant Execute Permission to Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8"
        run: |
          cd android
          ./gradlew assembleDebug -x lint -x test --no-daemon

      - name: Print Debug SHA-1 Fingerprint
        run: |
          cd android
          ./gradlew signingReport | grep -A 5 "Variant: debug" || true

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gossaigaon-bazar-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
