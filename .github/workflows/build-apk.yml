name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build React App and Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 7 ke liye Java JDK 21 zaroori hai
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install Capacitor CLI & Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Vite React Web App
        run: |
          npm run build

      - name: Configure Capacitor with JSON
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.chutki.user",
            "appName": "Chutki",
            "webDir": "dist"
          }
          EOF

          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy Firebase google-services.json
        run: |
          if [ -f "public/assets/aistudio/google-services_5c61c5de.json" ]; then
            mkdir -p android/app
            cp public/assets/aistudio/google-services_5c61c5de.json android/app/google-services.json
            echo "google-services.json copied successfully."
          fi

      - name: Sync Web Assets to Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug -x lint -x test --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chutki-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
